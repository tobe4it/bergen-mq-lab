name: Documentation quality

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'wiki/**'
      - 'tools/check_documentation.py'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'wiki/**'
      - 'tools/check_documentation.py'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Validate language parity and local links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Markdown documents
        run: python3 tools/check_documentation.py
